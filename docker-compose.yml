version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: smoke_detector_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: smokedetector
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: smoke_detector_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/smokedetector
      - PERSON_CONF=0.40
      - CIG_CONF=0.25
      - IOU_THRESH=0.45
      - OVERLAP_THRESH=0.30
    ports:
      - "8000:8000"
    volumes:
      - ./ml/models:/app/ml/models
      - ./backend/snapshots:/app/backend/snapshots
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smoke_detector_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
